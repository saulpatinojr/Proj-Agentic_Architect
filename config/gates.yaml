version: 1

default_timeout_ms: 600000

profiles:
  code-conductor:
    detect:
      all_files: [package.json, packages/cli/src/index.ts]
    gates:
      - id: typecheck
        command: npm
        args: [run, typecheck]
        blocking: true
      - id: unit-tests
        command: npm
        args: [test]
        blocking: true
      - id: repository-policy
        command: node
        args: [packages/cli/dist/index.js, validate, .]
        blocking: true

  node:
    detect:
      any_file: [package.json]
    gates:
      - id: npm-test
        command: npm
        args: [test]
        blocking: true

  terraform:
    detect:
      any_glob: ['*.tf', '**/*.tf']
    gates:
      - id: terraform-fmt
        command: terraform
        args: [fmt, -check, -recursive]
        blocking: true
      - id: terraform-validate
        command: terraform
        args: [validate]
        blocking: true

  ansible:
    detect:
      any_file: [ansible.cfg, requirements.yml, galaxy.yml]
    gates:
      - id: ansible-lint
        command: ansible-lint
        args: []
        blocking: true
