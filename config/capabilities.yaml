version: 1

defaults:
  billing_policy: subscription_first
  allow_separately_billed_api: false
  require_official_client_or_api: true

harnesses:
  copilot-github:
    provider: github
    auth_boundary: github
    subscription: copilot-pro-plus
    command_candidates: [gh]
    strengths: [github_native_pr_review, github_repository_context, github_actions_context, pull_request_quality_gate]
    automation: platform
    cli_preferred: false

  claude:
    provider: anthropic
    auth_boundary: claude-code
    subscription: claude-max
    command_candidates: [claude]
    strengths: [implementation, refactoring, codebase_reasoning, independent_review]
    automation: cli_headless
    cli_preferred: true
    safety:
      read_mode: permission-mode-plan
      modify_mode: permission-mode-acceptEdits-plus-worktree
      workstation_smoke_required: true

  codex:
    provider: openai
    auth_boundary: codex
    subscription: chatgpt-business
    command_candidates: [codex]
    strengths: [implementation, debugging, testing, repository_work]
    automation: cli_headless
    cli_preferred: true
    safety:
      read_mode: sandbox-read-only-approval-never
      modify_mode: sandbox-workspace-write-approval-never-plus-worktree
      workstation_smoke_required: true
      note: Managed/user Codex configuration can alter effective sandbox behavior; smoke validation is required on the installed version and OS.

  kiro:
    provider: aws
    auth_boundary: kiro-cli
    subscription: kiro-pro
    command_candidates: [kiro-cli]
    strengths: [specification, requirements, design_planning, implementation_planning, headless_worker]
    automation: cli_headless
    cli_preferred: true
    safety:
      read_mode: trust-read-grep
      modify_mode: trust-read-grep-write-shell-plus-worktree
      workstation_smoke_required: true
    headless:
      api_key_variable: KIRO_API_KEY
      subscription_credits: true

  antigravity:
    provider: google
    auth_boundary: antigravity-cli
    subscription: google-ai-pro
    command_candidates: [agy]
    strengths: [google_native_agent_work, gcp_specialization, independent_implementation, independent_review]
    automation: interactive_only_pending_upstream_safety
    cli_preferred: false
    safety:
      headless_execution_enabled: false
      reason: Current headless permission/sandbox behavior has unresolved upstream defects; do not use as an unattended worker until fixed and revalidated.

  perplexity:
    provider: perplexity
    auth_boundary: perplexity-pro-client
    subscription: perplexity-pro
    strengths: [web_research, source_discovery, research_synthesis]
    automation: manual_subscription_or_paid_mcp
    cli_preferred: false
    automation_modes:
      subscription_manual:
        separately_billed_api: false
      official_mcp_api:
        separately_billed_api: true
        enabled_by_default: false

  internal-validator:
    provider: code-conductor
    auth_boundary: local-process
    subscription: none
    command_candidates: []
    strengths: [deterministic_validation]
    automation: local
    cli_preferred: true

routing_invariants:
  - prefer_unique_platform_advantage
  - prefer_subscription_backed_lane
  - do_not_route_by_vendor_brand_alone
  - keep_harness_specific_behavior_out_of_core
  - require_independent_review_for_r2_or_higher
  - require_human_approval_for_r3_or_higher
  - require_workstation_smoke_before_external_headless_execution
