name: APM audit

on:
  pull_request:
    paths:
      - 'apm.yml'
      - 'apm.lock.yaml'
      - 'apm-policy.yml'
      - '.apm/**'
      - '.github/**'
      - '.claude/**'
      - '.kiro/**'
      - '.agents/**'
  push:
    branches:
      - main
      - 'bootstrap/**'
    paths:
      - 'apm.yml'
      - 'apm.lock.yaml'
      - 'apm-policy.yml'
      - '.apm/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/apm-action@v1
      - name: APM policy, integrity, and drift audit
        run: apm audit --ci --policy ./apm-policy.yml --no-fail-fast
