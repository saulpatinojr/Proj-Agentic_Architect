name: APM audit

on:
  pull_request:
    paths:
      - 'apm.yml'
      - 'apm.lock.yaml'
      - 'apm-policy.yml'
      - '.apm/**'
      - '.github/**'
      - '.claude/**'
      - '.codex/**'
      - '.kiro/**'
      - '.agents/**'
  push:
    branches:
      - main
      - 'bootstrap/**'
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'apm.yml'
      - 'apm.lock.yaml'
      - 'apm-policy.yml'
      - '.apm/**'
      - '.github/**'
      - '.claude/**'
      - '.codex/**'
      - '.kiro/**'
      - '.agents/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/apm-action@v1
        with:
          apm-version: '0.30.0'
          setup-only: true
      - name: Verify committed APM package, lockfile, policy, projections, and drift
        run: apm audit --ci --policy ./apm-policy.yml --no-fail-fast
