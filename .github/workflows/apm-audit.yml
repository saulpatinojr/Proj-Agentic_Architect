name: APM audit

on:
  pull_request:
    paths:
      - 'apm.yml'
      - 'apm.lock.yaml'
      - 'apm-policy.yml'
      - '.apm/**'
      - '.github/**'
      - '.claude/**'
      - '.codex/**'
      - '.kiro/**'
      - '.agents/**'
  push:
    branches:
      - main
      - 'bootstrap/**'
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
    paths:
      - 'apm.yml'
      - 'apm.lock.yaml'
      - 'apm-policy.yml'
      - '.apm/**'
      - '.github/**'
      - '.claude/**'
      - '.codex/**'
      - '.kiro/**'
      - '.agents/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          apm-version: '0.30.0'
          setup-only: true
      - name: Verify committed APM package, lockfile, policy, projections, and drift
        run: apm audit --ci --policy ./apm-policy.yml --no-fail-fast
