name: npm lockfile bootstrap

on:
  push:
    branches:
      - bootstrap/code-conductor-v0.1
    paths:
      - 'package.json'
      - 'packages/*/package.json'
      - 'apps/*/package.json'
      - '.github/workflows/npm-lock-bootstrap.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(npm): generate package lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
