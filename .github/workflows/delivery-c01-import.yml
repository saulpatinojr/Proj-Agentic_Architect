name: One-time approved C01 source import
on:
  push:
    branches: [feat/packaged-defaults]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'saulpatinojr/Proj-Code_Conductor' && github.ref == 'refs/heads/feat/packaged-defaults'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify and apply the locally tested source delta, never execute it
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 07e7f6061c6c835649d497937a5766ea6128368a
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          raw=b''.join(pathlib.Path('.delivery/c01.%02d'%i).read_bytes() for i in range(4))
          patch=gzip.decompress(base64.b64decode(raw,validate=True))
          assert len(patch)==43472
          assert hashlib.sha256(patch).hexdigest()=='68a880cd28d3554dc2c19939e92a513289550a4ead0ea2b1dad28bd51acac455'
          subprocess.run(['git','apply','--check','--index','--unidiff-zero'],input=patch,check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero'],input=patch,check=True)
          PY
          git rm .delivery/c01.00 .delivery/c01.01 .delivery/c01.02 .delivery/c01.03 .github/workflows/delivery-c01-import.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: ship packaged defaults and verify standalone runtime' -m 'Owner-approved delivery #56, C01 #43. Imported exact locally tested source delta; 126 tests, typecheck, standalone smoke and VSIX packaging passed. One-time import material removed before PR review.'
          git push --force-with-lease="refs/heads/feat/packaged-defaults:$GITHUB_SHA" origin HEAD:refs/heads/feat/packaged-defaults
