name: One-shot release lockfile materialization

on:
  push:
    branches:
      - feat/release-engineering-clean
    paths:
      - .github/workflows/release-clean-lockfile-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/release-engineering-clean
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Materialize package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify only lockfile changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "package-lock.json"
          git diff --check
      - name: Commit generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: materialize release packaging lockfile"
          git push origin HEAD:feat/release-engineering-clean
