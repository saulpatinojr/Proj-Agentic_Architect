name: Code Conductor CI

on:
  push:
    branches:
      - main
      - 'bootstrap/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and build
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate repository policy
        run: node packages/cli/dist/index.js validate .

      - name: Verify lockfiles are present
        shell: bash
        run: |
          test -f package-lock.json
          test -f apm.lock.yaml
